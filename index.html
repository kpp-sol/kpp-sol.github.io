<body>
  <div id="__bundler_placeholder">Loading AI/ML-разработка для бизнеса — главная...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: center\">Обсудить проект<\/a>\n<\/nav>\n<\/div>\n<\/header>\n\n<section id=\"top\" style=\"border-bottom: 1px solid #111111\">\n<div style=\"max-width: 1280px; margin: 0 auto; padding: 96px 32px 0; position: relative\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: #555555\">AI / ML · LLM · MLOps<\/span>\n<h1 style=\"margin: 24px 0 0; font-size: 92px; line-height: 0.98; font-weight: 800; letter-spacing: -0.045em; max-width: 1100px; position: relative\">машинное обучение, которое работает в&nbsp;продакшене, а&nbsp;не&nbsp;в&nbsp;ноутбуке<svg width=\"367\" height=\"359\" sc-camel-view-box=\"0 0 367 359\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; left: 586px; top: 187px; width: 367px; height: 359px; overflow: visible; fill: none; stroke: #8a8378; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round\"><path d=\"M367 0 C362.7 39.1 316.4 67.3 285 84 C274.3 89.7 256.7 94.5 248.5 104 C238.4 115.7 243.7 143.3 244 157 C244.3 170.3 245 183.7 245 197 C245 207.9 246.9 222.1 244 233 C237.7 257.1 208 266.8 187 274 C172.5 279 159.8 280.9 145 280 C140.2 295.9 128.5 302.3 114 311 C78.1 332.5 35.8 339.3 0 359\" vector-effect=\"non-scaling-stroke\" style=\"stroke: #333333; border-color: #333333\"><\/path><\/svg><\/h1>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 32px; margin-top: 48px; padding-bottom: 56px\">\n<p style=\"margin: 0; font-size: 20px; line-height: 1.45; color: #333333; max-width: 600px\">Проектируем, обучаем и внедряем модели: прогнозы и оптимизацию запасов, рекомендации, LLM-ассистентов и агентов. Сами выводим решение в инфраструктуру заказчика и поддерживаем его. Результат модели меряется деньгами бизнеса, а не метрикой на тесте.<\/p>\n<a href=\"#contact\" style=\"background: #2B3CF0; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 17px; padding: 20px 32px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Рассказать о задаче →<\/a>\n<\/div>\n<svg width=\"625\" height=\"292\" sc-camel-view-box=\"0 0 625 292\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; left: 438px; top: 33px; width: 625px; height: 292px; overflow: visible; fill: none; stroke: #333333; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; border-color: #333333\"><path d=\"M0 35 C18.3 35 36.7 35 55 35 C85.6 35 110.8 38.9 106 75 C104.4 75.3 102.6 75.7 101 76 C100.3 54.5 129.3 45.6 147 42 C179.7 35.4 221.1 35.5 248 58 C253 62.2 264.4 72.6 263.8 80.8 C263.7 82 261.9 82.8 262 84 C265.9 37.6 344.8 6.2 385 2 C401.4 0.3 427.1 -1.5 444 2 C521.1 17.9 577.5 95.4 606 163 C617.2 189.4 635.2 245.8 621 275 C616.8 283.6 610 286.9 603 292\" vector-effect=\"non-scaling-stroke\"><\/path><\/svg><\/div>\n<div style=\"border-top: 1px solid #111111\">\n<div style=\"max-width: 1280px; margin: 0 auto; padding: 0 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr))\">\n<div style=\"padding: 28px 24px 28px 0; display: flex; flex-direction: column; gap: 8px; position: relative\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #2B3CF0\">[01]<\/span>\n<span style=\"font-size: 18px; font-weight: 700\">Аудит задачи и данных<\/span>\n<span style=\"font-size: 15px; line-height: 1.5; color: #555555\">Где ML даст эффект и как его измерить<\/span>\n<\/div>\n<div style=\"padding: 28px 24px; border-left: 1px solid #DDDDDD; display: flex; flex-direction: column; gap: 8px; position: relative\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #2B3CF0\">[02]<\/span>\n<span style=\"font-size: 18px; font-weight: 700\">Прототип на ваших данных<\/span>\n<span style=\"font-size: 15px; line-height: 1.5; color: #555555\">Проверяем подход до полного внедрения<\/span>\n<\/div>\n<div style=\"padding: 28px 24px; border-left: 1px solid #DDDDDD; display: flex; flex-direction: column; gap: 8px; position: relative\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #2B3CF0\">[03]<\/span>\n<span style=\"font-size: 18px; font-weight: 700\">Внедрение<\/span>\n<span style=\"font-size: 15px; line-height: 1.5; color: #555555\">API, интеграции, облако или ваш контур<\/span>\n<\/div>\n<div style=\"padding: 28px 24px; border-left: 1px solid #DDDDDD; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #2B3CF0\">[04]<\/span>\n<span style=\"font-size: 18px; font-weight: 700\">Поддержка<\/span>\n<span style=\"font-size: 15px; line-height: 1.5; color: #555555\">Мониторинг качества, дообучение, развитие<\/span>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<section id=\"industries\" style=\"background: #111111; color: #FFFFFF\">\n<div sc-camel-on-mouse-enter=\"{{indPause}}\" sc-camel-on-mouse-leave=\"{{indResume}}\" style=\"max-width: 1280px; margin: 0 auto; padding: 96px 32px; display: flex; flex-direction: column; gap: 56px\">\n\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 16px 64px\">\n<h2 style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.06em; color: #BBBBBB\">Что мы делаем и для кого<\/h2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.55; color: #BBBBBB; max-width: 560px\">Делаем программы, которые учатся на данных вашей компании и берут на себя часть работы людей. Нам подходят компании, у которых накопились данные и много повторяющейся рутины.<\/p>\n<\/div>\n\n<div aria-live=\"polite\" style=\"display: flex; flex-direction: column\">\n<span style=\"display: block; font-size: clamp(44px, 7vw, 92px); line-height: 1.25; font-weight: 800; letter-spacing: -0.045em\">Помогаем<\/span>\n<span class=\"slot\" style=\"font-size: clamp(44px, 7vw, 92px); font-weight: 800; letter-spacing: -0.045em; color: #8FA0FF\">\n<span class=\"col\" style=\"transform: translateY({{indShift}})\"><sc-for list=\"{{inds}}\" as=\"it\" hint-placeholder-count=\"6\"><span class=\"cell\">{{it.who}}<\/span><\/sc-for><\/span>\n<\/span>\n<span class=\"slot\" style=\"font-size: clamp(22px, 3.2vw, 40px); font-weight: 600; letter-spacing: -0.02em; color: #FFFFFF\">\n<span class=\"col late\" style=\"transform: translateY({{indShift}})\"><sc-for list=\"{{inds}}\" as=\"it\" hint-placeholder-count=\"6\"><span class=\"cell\">{{it.what}}<\/span><\/sc-for><\/span>\n<\/span>\n<\/div>\n\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #BBBBBB\"><span style=\"color: #FFFFFF\">{{indNum}}<\/span> / {{indTotal}}<\/span>\n<div style=\"display: flex; gap: 8px\">\n<button type=\"button\" class=\"ind-arrow\" aria-label=\"Предыдущая отрасль\" sc-camel-on-click=\"{{indPrev}}\" style=\"width: 48px; height: 48px; border: 1px solid #555555; background: transparent; color: #FFFFFF; font: inherit; font-size: 20px; cursor: pointer\">←<\/button>\n<button type=\"button\" class=\"ind-arrow\" aria-label=\"Следующая отрасль\" sc-camel-on-click=\"{{indNext}}\" style=\"width: 48px; height: 48px; border: 1px solid #555555; background: transparent; color: #FFFFFF; font: inherit; font-size: 20px; cursor: pointer\">→<\/button>\n<\/div>\n<\/div>\n<div role=\"tablist\" aria-label=\"Отрасли\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 16px\">\n<sc-for list=\"{{inds}}\" as=\"it\" hint-placeholder-count=\"6\">\n<button type=\"button\" role=\"tab\" class=\"tab\" aria-selected=\"{{it.isActive}}\" sc-camel-on-click=\"{{it.pick}}\" style=\"position: relative; text-align: left; font: inherit; font-size: 16px; font-weight: 600; background: transparent; border: 0; padding: 12px 0 16px; cursor: pointer; color: {{it.color}}\">\n{{it.tab}}\n<span class=\"track\" aria-hidden=\"true\"><\/span>\n<sc-if value=\"{{it.isActive}}\" hint-placeholder-val=\"{{ false }}\">\n<span class=\"bar\" aria-hidden=\"true\" sc-camel-on-animation-end=\"{{it.done}}\" style=\"animation-play-state: {{indPlay}}\"><\/span>\n<\/sc-if>\n<\/button>\n<\/sc-for>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 32px; padding-top: 12px\">\n<div style=\"flex: 999 1 560px; min-width: 0; min-height: 150px\">\n<sc-for list=\"{{inds}}\" as=\"it\" hint-placeholder-count=\"1\">\n<sc-if value=\"{{it.isActive}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"pane-in\" role=\"tabpanel\" style=\"display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-size: 26px; font-weight: 700; letter-spacing: -0.02em\">{{it.title}}<\/span>\n<span style=\"font-size: 17px; line-height: 1.55; color: #BBBBBB; max-width: 720px\">{{it.text}}<\/span>\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8FA0FF\">{{it.tags}}<\/span>\n<\/div>\n<\/sc-if>\n<\/sc-for>\n<\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<a href=\"#services\" style=\"border: 1px solid #FFFFFF; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px; padding: 16px 24px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Все услуги<\/a>\n<a href=\"#contact\" style=\"background: #2B3CF0; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px; padding: 16px 24px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Обсудить задачу →<\/a>\n<\/div>\n<\/div>\n<\/div>\n\n<\/div>\n<\/section>\n<section id=\"services\" style=\"border-bottom: 1px solid #111111\">\n<div style=\"max-width: 1280px; margin: 0 auto; padding: 96px 32px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 48px\">\n<h2 style=\"margin: 0; font-size: 56px; line-height: 1; font-weight: 800; letter-spacing: -0.035em\">Услуги<\/h2>\n<p style=\"margin: 0; line-height: 1.5; color: #555555; max-width: 460px; font-size: 17px\">Шесть направлений, в каждом — типовые задачи, с которыми к нам можно обратиться<br><\/p>\n<\/div>\n\n<div style=\"border-top: 1px solid #111111; padding: 36px 0; display: flex; flex-wrap: wrap; gap: 24px 48px\">\n<span style=\"flex: 0 0 64px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #2B3CF0\">[01]<\/span>\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<h3 style=\"margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em\">Прогноз спроса и оптимизация запасов<\/h3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #333333\">Сколько продастся, сколько закупить, где хранить. Меньше дефицита, меньше денег, замороженных в остатках.<\/p>\n<\/div>\n<ul style=\"flex: 1 1 340px; min-width: 0; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.45\">\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Прогноз продаж по товарам, магазинам и складам с учётом сезонности и промо<\/li>\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Автоматический расчёт заказов поставщикам<\/li>\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Распределение остатков между складами и точками<\/li>\n<li>Прогноз загрузки: персонал, производство, логистика<\/li>\n<\/ul>\n<\/div>\n\n<div style=\"border-top: 1px solid #111111; padding: 36px 0; display: flex; flex-wrap: wrap; gap: 24px 48px\">\n<span style=\"flex: 0 0 64px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #2B3CF0\">[02]<\/span>\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<h3 style=\"margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em\">LLM-ассистенты по данным компании<\/h3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #333333\">Ассистенты, которые отвечают по вашим документам и базе знаний, со ссылкой на источник.<\/p>\n<\/div>\n<ul style=\"flex: 1 1 340px; min-width: 0; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.45\">\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Бот для сотрудников по регламентам, инструкциям и внутренней вики<\/li>\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Первая линия поддержки клиентов с передачей сложного оператору<\/li>\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Поиск по договорам, тендерной и технической документации<\/li>\n<li>Подготовка черновиков ответов, писем и справок<\/li>\n<\/ul>\n<\/div>\n\n<div style=\"border-top: 1px solid #111111; padding: 36px 0; display: flex; flex-wrap: wrap; gap: 24px 48px\">\n<span style=\"flex: 0 0 64px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #2B3CF0\">[03]<\/span>\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<h3 style=\"margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em\">AI-агенты для автоматизации процессов<\/h3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #333333\">Агенты, которые не просто отвечают, а выполняют цепочку действий в ваших системах.<\/p>\n<\/div>\n<ul style=\"flex: 1 1 340px; min-width: 0; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.45\">\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Разбор входящих заявок и писем, заведение задач в CRM или трекере<\/li>\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Сбор данных из нескольких систем и подготовка регулярных отчётов<\/li>\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Мониторинг источников: новости, тендеры, упоминания<\/li>\n<li>Сверка документов и проверка на соответствие правилам<\/li>\n<\/ul>\n<\/div>\n\n<div style=\"border-top: 1px solid #111111; padding: 36px 0; display: flex; flex-wrap: wrap; gap: 24px 48px\">\n<span style=\"flex: 0 0 64px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #2B3CF0\">[04]<\/span>\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<h3 style=\"margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em\">Рекомендательные системы<\/h3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #333333\">Персонализация, которая растит средний чек и возвращаемость.<\/p>\n<\/div>\n<ul style=\"flex: 1 1 340px; min-width: 0; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.45\">\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">«С этим покупают» и похожие товары на сайте и в приложении<\/li>\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Персональные подборки в рассылках и пушах<\/li>\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Рекомендации контента и услуг<\/li>\n<li>A/B-тесты, чтобы эффект был измерен, а не предполагаем<\/li>\n<\/ul>\n<\/div>\n\n<div style=\"border-top: 1px solid #111111; padding: 36px 0; display: flex; flex-wrap: wrap; gap: 24px 48px\">\n<span style=\"flex: 0 0 64px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #2B3CF0\">[05]<\/span>\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<h3 style=\"margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em\">Анализ текстов<\/h3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #333333\">Превращаем поток отзывов, обращений и документов в структурированные данные.<\/p>\n<\/div>\n<ul style=\"flex: 1 1 340px; min-width: 0; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.45\">\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Классификация и маршрутизация обращений<\/li>\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Темы и тональность отзывов, мониторинг упоминаний в СМИ<\/li>\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Анализ новостного потока<\/li>\n<li>Суммаризация звонков, переписки и отчётов<\/li>\n<\/ul>\n<\/div>\n\n<div style=\"border-top: 1px solid #111111; border-bottom: 1px solid #111111; padding: 36px 0; display: flex; flex-wrap: wrap; gap: 24px 48px\">\n<span style=\"flex: 0 0 64px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #2B3CF0\">[06]<\/span>\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<h3 style=\"margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em\">Развёртывание и MLOps<\/h3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #333333\">Выводим модели в прод и держим их в рабочем состоянии, в том числе в закрытом контуре.<\/p>\n<\/div>\n<ul style=\"flex: 1 1 340px; min-width: 0; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.45\">\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Open-source LLM на ваших серверах, без передачи данных наружу<\/li>\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Перенос моделей из ноутбуков в сервисы с API<\/li>\n<li style=\"border-bottom: 1px solid #EEEEEE; padding-bottom: 10px\">Мониторинг качества и дрейфа данных, автоматическое дообучение<\/li>\n<li>CI/CD, контейнеризация, отказоустойчивость<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/section>\n\n<section id=\"cases\" style=\"border-bottom: 1px solid #111111\">\n<div style=\"max-width: 1280px; margin: 0 auto; padding: 96px 32px; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<h2 style=\"margin: 0; font-size: 56px; line-height: 1; font-weight: 800; letter-spacing: -0.035em\">Кейсы<\/h2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #555555; max-width: 460px\">Проекты, в которых участвовала наша команда. Нажмите на карточку, чтобы прочитать кейс целиком.<\/p>\n<\/div>\n<div style=\"display: flex; gap: 8px\">\n<button type=\"button\" aria-label=\"Предыдущие кейсы\" sc-camel-on-click=\"{{prev}}\" class=\"case-arrow\" style=\"width: 56px; height: 56px; border: 1px solid #111111; background: #FFFFFF; color: #111111; font: inherit; font-size: 22px; cursor: pointer\">←<\/button>\n<button type=\"button\" aria-label=\"Следующие кейсы\" sc-camel-on-click=\"{{next}}\" class=\"case-arrow\" style=\"width: 56px; height: 56px; border: 1px solid #111111; background: #FFFFFF; color: #111111; font: inherit; font-size: 22px; cursor: pointer\">→<\/button>\n<\/div>\n<\/div>\n<div data-track=\"cases\" class=\"case-track\" style=\"display: flex; gap: 24px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 16px\">\n<sc-for list=\"{{items}}\" as=\"item\" hint-placeholder-count=\"5\">\n<button type=\"button\" class=\"case-card\" sc-camel-on-click=\"{{item.open}}\" style=\"flex: 0 0 min(380px, 85%); scroll-snap-align: start; min-height: 360px; text-align: left; font: inherit; color: #111111; background: #FFFFFF; border: 1px solid #111111; padding: 32px; display: flex; flex-direction: column; gap: 16px; cursor: pointer; box-sizing: border-box\">\n<span style=\"display: flex; justify-content n style=\"border: 1px solid #111111; padding: 6px 12px\">Kafka<\/span><span style=\"border: 1px solid #111111; padding: 6px 12px\">Spark<\/span><\/span>\n<\/div>\n<div style=\"border-top: 1px solid #DDDDDD; border-bottom: 1px solid #DDDDDD; padding: 20px 0; display: flex; flex-wrap: wrap; gap: 12px 40px; align-items: baseline\">\n<span style=\"flex: 0 0 240px; font-size: 18px; font-weight: 700\">Инфраструктура и MLOps<\/span>\n<span style=\"flex: 1 1 480px; display: flex; flex-wrap: wrap; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 14px\"><span style=\"border: 1px solid #111111; padding: 6px 12px\">Docker<\/span><span style=\"border: 1px solid #111111; padding: 6px 12px\">Kubernetes<\/span><span style=\"border: 1px solid #111111; padding: 6px 12px\">GitLab<\/span><span style=\"border: 1px solid #111111; padding: 6px 12px\">FastAPI<\/span><span style=\"border: 1px solid #111111; padding: 6px 12px\">MLflow<\/span><span style=\"border: 1px solid #111111; padding: 6px 12px\">DVC<\/span><span style=\"border: 1px solid #111111; padding: 6px 12px\">Prometheus<\/span><span style=\"border: 1px solid #111111; padding: 6px 12px\">Grafana<\/span><\/span>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<section id=\"faq\" style=\"border-bottom: 1px solid #111111\">\n<div style=\"max-width: 1280px; margin: 0 auto; padding: 96px 32px; display: flex; flex-wrap: wrap; gap: 32px 64px\">\n<h2 style=\"flex: 0 1 360px; margin: 0; font-size: 56px; line-height: 1; font-weight: 800; letter-spacing: -0.035em\">Вопросы<\/h2>\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n<details class=\"acc\" open=\"\" style=\"border-top: 1px solid #111111;\">\n<summary style=\"cursor: pointer; padding: 24px 0; display: flex; align-items: center; justify-content: space-between; gap: 24px\">\n<h3 class=\"ttl\" style=\"margin: 0; font-size: 20px; font-weight: 700\">Как понять, нужен ли нам ML вообще?<\/h3>\n<span class=\"plus\" aria-hidden=\"true\" style=\"font-size: 28px; font-weight: 300; line-height: 1\">+<\/span>\n<\/summary>\n<p class=\"acc-body\" style=\"margin: 0; padding: 0 48px 24px 0; font-size: 16px; line-height: 1.55; color: #333333\">Начинаем с аудита: смотрим задачу и данные и прямо говорим, где ML окупится, а где хватит простой автоматизации.<\/p>\n<\/details>\n<details class=\"acc\" style=\"border-top: 1px solid #DDDDDD;\">\n<summary style=\"cursor: pointer; padding: 24px 0; display: flex; align-items: center; justify-content: space-between; gap: 24px\">\n<h3 class=\"ttl\" style=\"margin: 0; font-size: 20px; font-weight: 700\">Данных мало или они разрознены. Это проблема?<\/h3>\n<span class=\"plus\" aria-hidden=\"true\" style=\"font-size: 28px; font-weight: 300; line-height: 1\">+<\/span>\n<\/summary>\n<p class=\"acc-body\" style=\"margin: 0; padding: 0 48px 24px 0; font-size: 16px; line-height: 1.55; color: #333333\">Не всегда. На пилоте проверяем, что из них можно извлечь, и при необходимости помогаем наладить сбор.<\/p>\n<\/details>\n<details class=\"acc\" style=\"border-top: 1px solid #DDDDDD;\">\n<summary style=\"cursor: pointer; padding: 24px 0; display: flex; align-items: center; justify-content: space-between; gap: 24px\">\n<h3 class=\"ttl\" style=\"margin: 0; font-size: 20px; font-weight: 700\">Какие LLM вы используете?<\/h3>\n<span class=\"plus\" aria-hidden=\"true\" style=\"font-size: 28px; font-weight: 300; line-height: 1\">+<\/span>\n<\/summary>\n<p class=\"acc-body\" style=\"margin: 0; padding: 0 48px 24px 0; font-size: 16px; line-height: 1.55; color: #333333\">Подбираем под задачу и требования к безопасности: облачные модели через API или open-source модели в вашем контуре.<\/p>\n<\/details>\n<details class=\"acc\" style=\"border-top: 1px solid #DDDDDD;\">\n<summary style=\"cursor: pointer; padding: 24px 0; display: flex; align-items: center; justify-content: space-between; gap: 24px\">\n<h3 class=\"ttl\" style=\"margin: 0; font-size: 20px; font-weight: 700\">Сколько времени занимает проект?<\/h3>\n<span class=\"plus\" aria-hidden=\"true\" style=\"font-size: 28px; font-weight: 300; line-height: 1\">+<\/span>\n<\/summary>\n<p class=\"acc-body\" style=\"margin: 0; padding: 0 48px 24px 0; font-size: 16px; line-height: 1.55; color: #333333\">Сроки и стоимость обсуждаем под задачу и даём оценку после первого созвона. Обычно начинаем с прототипа на ваших данных, полное внедрение — от одного до нескольких месяцев.<\/p>\n<\/details>\n<details class=\"acc\" style=\"border-top: 1px solid #DDDDDD; border-bottom: 1px solid #DDDDDD;\">\n<summary style=\"cursor: pointer; padding: 24px 0; display: flex; align-items: center; justify-content: space-between; gap: 24px\">\n<h3 class=\"ttl\" style=\"margin: 0; font-size: 20px; font-weight: 700\">Кому принадлежит результат?<\/h3>\n<span class=\"plus\" aria-hidden=\"true\" style=\"font-size: 28px; font-weight: 300; line-height: 1\">+<\/span>\n<\/summary>\n<p class=\"acc-body\" style=\"margin: 0; padding: 0 48px 24px 0; font-size: 16px; line-height: 1.55; color: #333333\">Вам: код, модели и документацию передаём по итогам проекта.<\/p>\n<\/details>\n<\/div>\n<\/div>\n<\/section>\n\n<section id=\"contact\" style=\"background: #2B3CF0; color: #FFFFFF\">\n<div style=\"max-width: 1280px; margin: 0 auto; padding: 120px 32px; display: flex; flex-direction: column; gap: 64px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px\">\n<h2 style=\"margin: 0; font-size: 104px; line-height: 0.95; font-weight: 800; letter-spacing: -0.045em; max-width: 900px\">Расскажите о&nbsp;задаче<\/h2>\n<p style=\"margin: 0; font-size: 19px; line-height: 1.5; color: #E3E6FF; max-width: 380px\">Ответим в течение [СРОК ОТВЕТА], зададим пару уточняющих вопросов и предложим время для созвона.<\/p>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 48px 80px; border-top: 1px solid rgba(255,255,255,0.5); padding-top: 48px\">\n\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: #E3E6FF; padding-bottom: 12px\">Контакты<\/span>\n<a href=\"#contact\" style=\"color: #FFFFFF; text-decoration: none; border-top: 1px solid rgba(255,255,255,0.35); padding: 18px 0; display: flex; justify-content: space-between; gap: 16px; font-size: 22px; font-weight: 600\"><span>Telegram<\/span><span style=\"font-weight: 400\">[@ВАШ_ТЕЛЕГРАМ]<\/span><\/a>\n<a href=\"#contact\" style=\"color: #FFFFFF; text-decoration: none; border-top: 1px solid rgba(255,255,255,0.35); padding: 18px 0; display: flex; justify-content: space-between; gap: 16px; font-size: 22px; font-weight: 600\"><span>Почта<\/span><span style=\"font-weight: 400\">[ВАША ПОЧТА]<\/span><\/a>\n<a href=\"#contact\" style=\"color: #FFFFFF; text-decoration: none; border-top: 1px solid rgba(255,255,255,0.35); padding: 18px 0; display: flex; justify-content: space-between; gap: 16px; font-size: 22px; font-weight: 600\"><span>Телефон<\/span><span style=\"font-weight: 400\">[ТЕЛЕФОН]<\/span><\/a>\n<div style=\"border-top: 1px solid rgba(255,255,255,0.35); border-bottom: 1px solid rgba(255,255,255,0.35); padding: 18px 0; display: flex; justify-content: space-between; gap: 16px; font-size: 22px; font-weight: 600\"><span>Город<\/span><span style=\"font-weight: 400\">[ГОРОД] · работаем удалённо<\/span><\/div>\n<\/div>\n\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: #E3E6FF\">Что будет после заявки<\/span>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px\">\n<li style=\"display: flex; gap: 16px; font-size: 17px; line-height: 1.5\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; padding-top: 3px\">01<\/span><span>Изучим задачу и при необходимости подпишем NDA<\/span><\/li>\n<li style=\"display: flex; gap: 16px; font-size: 17px; line-height: 1.5\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; padding-top: 3px\">02<\/span><span>Созвонимся, разберём данные и ожидания<\/span><\/li>\n<li style=\"display: flex; gap: 16px; font-size: 17px; line-height: 1.5\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; padding-top: 3px\">03<\/span><span>Пришлём план работ, сроки и стоимость<\/span><\/li>\n<\/ol>\n<\/div>\n<\/div>\n\n<form style=\"flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<label for=\"f-name\" style=\"font-size: 14px; font-weight: 600\">Имя<\/label>\n<input id=\"f-name\" type=\"text\" autocomplete=\"name\" style=\"font: inherit; font-size: 18px; padding: 14px 0; border: 0; border-bottom: 1px solid #FFFFFF; background: transparent; color: #FFFFFF; min-height: 52px; box-sizing: border-box\">\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<label for=\"f-company\" style=\"font-size: 14px; font-weight: 600\">Компания<\/label>\n<input id=\"f-company\" type=\"text\" autocomplete=\"organization\" style=\"font: inherit; font-size: 18px; padding: 14px 0; border: 0; border-bottom: 1px solid #FFFFFF; background: transparent; color: #FFFFFF; min-height: 52px; box-sizing: border-box\">\n<\/div>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<label for=\"f-contact\" style=\"font-size: 14px; font-weight: 600\">Telegram, телефон или почта<\/label>\n<input id=\"f-contact\" type=\"text\" style=\"font: inherit; font-size: 18px; padding: 14px 0; border: 0; border-bottom: 1px solid #FFFFFF; background: transparent; color: #FFFFFF; min-height: 52px; box-sizing: border-box\">\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<label for=\"f-industry\" style=\"font-size: 14px; font-weight: 600\">Отрасль<\/label>\n<sc-raw-select id=\"f-industry\" style=\"font: inherit; font-size: 18px; padding: 14px 0; border: 0; border-bottom: 1px solid #FFFFFF; background: transparent; color: #FFFFFF; min-height: 52px; box-sizing: border-box\">\n<option style=\"color: #111111\">Выберите<\/option>\n<option style=\"color: #111111\">Ритейл и e-commerce<\/option>\n<option style=\"color: #111111\">Финансы и страхование<\/option>\n<option style=\"color: #111111\">Логистика и дистрибуция<\/option>\n<option style=\"color: #111111\">Производство<\/option>\n<option style=\"color: #111111\">Медиа и онлайн-сервисы<\/option>\n<option style=\"color: #111111\">B2B и услуги<\/option>\n<option style=\"color: #111111\">Другое<\/option>\n<\/sc-raw-select>\n<\/div>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<label for=\"f-task\" style=\"font-size: 14px; font-weight: 600\">Задача<\/label>\n<textarea id=\"f-task\" rows=\"5\" placeholder=\"Что хотите автоматизировать или улучшить, какие данные есть\" style=\"font: inherit; font-size: 18px; padding: 14px 0; border: 0; border-bottom: 1px solid #FFFFFF; background: transparent; color: #FFFFFF; box-sizing: border-box; resize: vertical\"><\/textarea>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<label for=\"f-time\" style=\"font-size: 14px; font-weight: 600\">Желаемые сроки <span style=\"font-weight: 400; color: #E3E6FF\">— необязательно<\/span><\/label>\n<input id=\"f-time\" type=\"text\" style=\"font: inherit; font-size: 18px; padding: 14px 0; border: 0; border-bottom: 1px solid #FFFFFF; background: transparent; color: #FFFFFF; min-height: 52px; box-sizing: border-box\">\n<\/div>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; margin-top: 8px\">\n<button type=\"button\" style=\"font: inherit; font-size: 18px; font-weight: 700; background: #FFFFFF; color: #111111; border: 0; padding: 20px 36px; min-height: 56px; cursor: pointer\">Отправить заявку →<\/button>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #E3E6FF; max-width: 300px\">Нажимая кнопку, вы соглашаетесь на обработку персональных данных.<\/p>\n<\/div>\n<\/form>\n\n<\/div>\n<\/div>\n<\/section>\n\n<footer style=\"background: #111111; color: #BBBBBB\">\n<div style=\"max-width: 1280px; margin: 0 auto; padding: 32px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 14px\">\n<span>© 2026 [НАЗВАНИЕ]<\/span>\n<span>[ИП / САМОЗАНЯТЫЙ, ИНН]<\/span>\n<\/div>\n<\/footer>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:7600}}\">\nclass Component extends DCLogic {\n  getCases() {\n    if (this._cases) return this._cases;\n    this._cases = [\n      {\n        \"tag\": \"BI · LLM-агенты\",\n        \"title\": \"LLM-агент для корпоративной BI-системы\",\n        \"task\": \"Дать внутренней AI-платформе компании доступ к BI, чтобы сотрудники работали с отчётами и дашбордами через агента.\",\n        \"result\": \"Обновление без потерь: 722 графика, 87 дашбордов\",\n        \"context\": \"Крупная компания. BI-система на Apache Superset 4.0.2 в Docker, собственная AI-платформа с OpenAI-совместимым API. Аналитики хотели ассистента, который понимает, какие отчёты есть, и умеет с ними работать.\",\n        \"problem\": \"Старая версия BI не подходила для интеграции с агентом, а обновление рисковало сотнями отчётов. Агенту нужен был доступ на чтение и запись, но без открытия BI-системы наружу.\",\n        \"steps\": [\n          {\n            \"n\": \"01\",\n            \"text\": \"Сняли бэкап метаданных и обновили Superset поэтапно: 4.0.2 → 5.0 → 6.0, сверяя объекты после каждого шага.\"\n          },\n          {\n            \"n\": \"02\",\n            \"text\": \"Развернули MCP-сервер в отдельном контейнере с сервисной учётной записью; сетевой доступ к нему открыт только для AI-платформы.\"\n          },\n          {\n            \"n\": \"03\",\n            \"text\": \"Провели сквозные тесты чтения и записи, подключили агента, устранили отказ фоновых воркеров после перезагрузки сервера.\"\n          }\n        ],\n        \"resultFull\": \"Агент опубликован на AI-платформе и отвечает реальными данными из BI. На его основе аналитики собрали бизнес-ассистента для работы с отчётами. Обновление прошло без потерь: 722 графика, 87 дашбордов, 239 датасетов и 8 подключений к базам данных.\",\n        \"stack\": [\n          \"Apache Superset\",\n          \"MCP\",\n          \"Python\",\n          \"Docker\",\n          \"PostgreSQL\",\n          \"Redis\",\n          \"iptables\"\n        ],\n        \"num\": \"01\"\n      },\n      {\n        \"tag\": \"BI · LLM · закрытый контур\",\n        \"title\": \"AI-ассистент в BI без передачи данных наружу\",\n        \"task\": \"Проверить AI-функции отечественной BI-платформы так, чтобы данные компании не уходили к внешним LLM-провайдерам.\",\n        \"result\": \"Ассистент работает на внутренних моделях компании\",\n        \"context\": \"Компания оценивает AI-возможности BI-систем для аналитиков. LLM доступны через внутреннюю платформу компании, внешние облачные модели использовать нельзя.\",\n        \"problem\": \"AI-модуль BI по умолчанию рассчитан на внешние модели. Нужно было подключить его к внутренней LLM-платформе, открыть доступ только из корпоративной сети и уложиться в ресурсы тестового сервера.\",\n        \"steps\": [\n          {\n            \"n\": \"01\",\n            \"text\": \"Развернули AI-модуль рядом с BI-платформой на тестовом стенде и открыли доступ к нему только из корпоративного VPN.\"\n          },\n          {\n            \"n\": \"02\",\n            \"text\": \"Подключили модели внутренней LLM-платформы, согласовали лимиты токенов и модель эмбеддингов.\"\n          },\n          {\n            \"n\": \"03\",\n            \"text\": \"Готовим переход на версию BI со встроенным ассистентом и подключение MCP для работы агента с данными.\"\n          }\n        ],\n        \"resultFull\": \"AI-ассистент в BI работает на моделях внутренней платформы: данные не покидают контур компании. Команда аналитики получила стенд, на котором можно оценивать AI-сценарии до внедрения в рабочую среду.\",\n        \"stack\": [\n          \"PIX BI\",\n          \"LLM API\",\n          \"Docker\",\n          \"VPN\",\n          \"Linux\"\n        ],\n        \"num\": \"02\"\n      },\n      {\n        \"tag\": \"Инфраструктура · Kubernetes\",\n        \"title\": \"Внутренняя платформа сервисов на Kubernetes\",\n        \"task\": \"Собрать для компании единую платформу, где живут внутренние сервисы, а сотрудники входят во все из них под одной учётной записью.\",\n        \"result\": \"Несколько сервисов в одном кластере, единый вход для сотрудников\",\n        \"context\": \"Компании нужны несколько внутренних инструментов: BI-системы, каталог данных, мониторинг. Их удобно держать в одном месте, под единым управлением и с понятными правами доступа.\",\n        \"problem\": \"Когда каждый сервис живёт отдельно, у каждого свой логин, свои админы и свой способ обновления. Сотрудники путаются в учётках, а команде сложно поддерживать и масштабировать такой зоопарк.\",\n        \"steps\": [\n          {\n            \"n\": \"01\",\n            \"text\": \"Спроектировали кластер Kubernetes: системные компоненты и бизнес-сервисы разнесены по отдельным группам узлов, ресурсы рассчитаны под реальную нагрузку.\"\n          },\n          {\n            \"n\": \"02\",\n            \"text\": \"Развернули в кластере внутренние сервисы компании: BI-системы и каталог данных, с хранением данных в PostgreSQL.\"\n          },\n          {\n            \"n\": \"03\",\n            \"text\": \"Настроили единый вход через Keycloak: роли администраторов, аналитиков и читателей, подключение к корпоративному каталогу сотрудников, секреты в защищённом хранилище.\"\n          },\n          {\n            \"n\": \"04\",\n            \"text\": \"Подключили мониторинг на VictoriaMetrics и Grafana и описали каждый сервис в GitLab: код развёртывания, README и вики платформы.\"\n          }\n        ],\n        \"resultFull\": \"Внутренние сервисы компании работают на одной платформе в Kubernetes. Сотрудники входят во все инструменты через единый вход и видят только то, что положено их роли. Новый сервис добавляется по отработанной схеме, а вся конфигурация хранится в GitLab и воспроизводится с нуля.\",\n        \"stack\": [\n          \"Kubernetes\",\n          \"Keycloak\",\n          \"SSO\",\n          \"VictoriaMetrics\",\n          \"Grafana\",\n          \"PostgreSQL\",\n          \"GitLab\"\n        ],\n        \"num\": \"03\"\n      },\n      {\n        \"tag\": \"Deep Learning · CoLES\",\n        \"title\": \"Универсальные эмбеддинги пользователей на базе CoLES\",\n        \"task\": \"Повысить качество моделей персонализации и прогнозирования поведения пользователей, научившись учитывать историю их действий в разных источниках данных.\",\n        \"result\": \"ROC-AUC downstream-моделей: относительный прирост 7–15%\",\n        \"context\": \"Для масштабных задач персонализации бизнесу требовались универсальные признаки пользователей. Данные охватывали десятки миллионов пользователей и несколько доменов поведения, каждый со своей структурой и последовательностями событий.\",\n        \"problem\": \"Агрегированные признаки не всегда сохраняют информацию о порядке и контексте действий. Разработка отдельного представления под каждый прогнозный таргет усложняет эксперименты и повторное использование моделей.\",\n        \"steps\": [\n          {\n            \"n\": \"01\",\n            \"text\": \"Подготовили последовательности пользовательских событий и организовали обработку данных для обучения на масштабе десятков миллионов пользователей.\"\n          },\n          {\n            \"n\": \"02\",\n            \"text\": \"Построили отдельные пайплайны CoLES для каждого поведенческого домена: применили контрастивное обучение, Transformer в роли Sequence Encoder и адаптировали необходимые модули PTLS.\"\n          },\n          {\n            \"n\": \"03\",\n            \"text\": \"Проверили переносимость полученных эмбеддингов на downstream-задачах, добавляя их в качестве признаков к целевым моделям и сравнивая ROC-AUC.\"\n          },\n          {\n            \"n\": \"04\",\n            \"text\": \"Внедрили пайплайн в промышленную эксплуатацию. Обученные для доменов энкодеры стали переиспользуемыми компонентами в других ML-решениях.\"\n          }\n        ],\n        \"resultFull\": \"Добавление CoLES-эмбеддингов в downstream-модели обеспечило относительное улучшение ROC-AUC на 7–15% в проведённых экспериментах. Решение работает в production, используется несколькими командами и служит основой для предобучения доменных энкодеров в более сложных архитектурах.\",\n        \"stack\": [\n          \"PyTorch\",\n          \"PTLS\",\n          \"CoLES\",\n          \"Transformer\",\n          \"Contrastive Learning\"\n        ],\n        \"num\": \"04\"\n      },\n      {\n        \"tag\": \"Deep Learning · Multimodal AI\",\n        \"title\": \"Мультимодальный Transformer для персонализации\",\n        \"task\": \"Объединить разнородные пользовательские события в универсальное представление для персонализации и решения нескольких задач прогнозирования.\",\n        \"result\": \"Единая архитектура для ~14 доменов и нескольких прогнозных задач\",\n        \"context\": \"Для бизнес-задач персонализации данные поступали из разных поведенческих источников. Четыре основных домена и около десяти редких отличались по частоте событий, признакам и семантике. Требовалась архитектура, способная учитывать их совместно.\",\n        \"problem\": \"Отдельные модели, специально настроенные под конкретные таргеты, затрудняют совместное использование сигналов из разных доменов. Необходимо было объединить ранее обученные представления, обработать редкие события и сохранить качество прогнозов на отложенных по времени данных.\",\n        \"steps\": [\n          {\n            \"n\": \"01\",\n            \"text\": \"Подготовили данные из четырёх основных и порядка десяти редких доменов; разработали схему представления разнородных событий.\"\n          },\n          {\n            \"n\": \"02\",\n            \"text\": \"Интегрировали предобученные в CoLES доменные Event Encoders, а для редких доменов реализовали отдельный Event Encoder.\"\n          },\n          {\n            \"n\": \"03\",\n            \"text\": \"Обучили общий History Transformer, объединяющий события разных типов в универсальный эмбеддинг пользователя.\"\n          },\n          {\n            \"n\": \"04\",\n            \"text\": \"Совместили MLM-обучение (MSE и QuerySoftmax) с классификационными головами на downstream-таргеты. Провели OOT-валидацию и сравнили результаты со специализированными градиентными бустингами.\"\n          }\n        ],\n        \"resultFull\": \"Команда обучила и экспериментально проверила мультимодальную модель, объединяющую около 14 доменов и формирующую единое представление пользователя. На downstream-задачах получено качество, в целом сопоставимое со специализированными бустингами. Архитектура позволяет переиспользовать предобученные энкодеры и решать несколько задач в одной системе. Текущий статус — экспериментальная модель; промышленное внедрение не заявляется.\",\n        \"stack\": [\n          \"PyTorch\",\n          \"Transformer\",\n          \"CoLES\",\n          \"Multimodal Learning\",\n          \"MLM\",\n          \"QuerySoftmax\",\n          \"OOT Validation\"\n        ],\n        \"num\": \"05\"\n      }\n    ];\n    return this._cases;\n  }\n\n  getInds() {\n    if (this._inds) return this._inds;\n    this._inds = [\n      { tab: 'Ритейл и e-commerce', who: 'ритейлу и e-commerce', what: 'заказывать ровно столько товара, сколько продастся', title: 'Ритейл и e-commerce', text: 'Подскажем, сколько товара заказать и на какой склад отправить, чтобы не было ни дефицита, ни лишних остатков. Покажем покупателю товары, которые он, скорее всего, купит.', tags: 'прогноз спроса · рекомендации' },\n      { tab: 'Финансы', who: 'банкам и страховым', what: 'разбирать тысячи обращений без очереди', title: 'Финансы и страхование', text: 'Разберём входящие обращения и документы, будем следить за новостями о клиентах и рынке, дадим сотрудникам ассистента, который отвечает по внутренним регламентам.', tags: 'анализ текстов · ассистенты · прогнозы' },\n      { tab: 'Логистика', who: 'логистам', what: 'заранее знать загрузку складов и машин', title: 'Логистика и дистрибуция', text: 'Спрогнозируем загрузку складов и транспорта, поможем распределять остатки между точками так, чтобы товар был там, где его купят.', tags: 'прогноз спроса · оптимизация запасов' },\n      { tab: 'Производство', who: 'заводам', what: 'находить ответ в техдокументации за секунды', title: 'Производство', text: 'Рассчитаем потребность в сырье и материалах, сделаем быстрый поиск по технической документации и регламентам.', tags: 'прогнозы · ассистенты по документам' },\n      { tab: 'Медиа', who: 'медиа и сервисам', what: 'удерживать пользователей персональной лентой', title: 'Медиа и онлайн-сервисы', text: 'Подберём каждому пользователю контент, который его удержит, и разберём, что люди пишут в отзывах и обращениях.', tags: 'рекомендации · анализ текстов' },\n      { tab: 'B2B', who: 'B2B-командам', what: 'отдавать рутину с заявками и отчётами агентам', title: 'B2B и профессиональные услуги', text: 'Автоматизируем приём заявок и подготовку отчётов, сделаем ассистента, который ищет ответы в договорах и базе знаний.', tags: 'AI-агенты · ассистенты' }\n    ];\n    return this._inds;\n  }\n\n  setInd(i) {\n    const n = this.getInds().length;\n    this.setState({ ind: ((i % n) + n) % n });\n  }\n\n  constructor(props) {\n    super(props);\n    this.state = { active: null, phase: 0, from: null, ind: 0, indPaused: false };\n  }\n\n  reduced() {\n    return typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  }\n\n  openCase(i, e) {\n    clearTimeout(this._t);\n    const el = e && e.currentTarget;\n    const r = el ? el.getBoundingClientRect() : null;\n    const from = r ? { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width } : null;\n    if (this.reduced()) { this.setState({ active: i, phase: 1, from: from }); return; }\n    this.setState({ active: i, phase: 0, from: from });\n    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ phase: 1 })));\n  }\n\n  closeCase() {\n    if (!this.state || this.state.active === null || this.state.active === undefined) return;\n    if (this.reduced()) { this.setState({ active: null, phase: 0 }); return; }\n    this.setState({ phase: 0 });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ active: null }), 450);\n  }\n\n  scrollCases(dir, e) {\n    const section = e && e.currentTarget && e.currentTarget.closest('section');\n    const track = section && section.querySelector('[data-track=\"cases\"]');\n    if (!track) return;\n    const card = track.firstElementChild;\n    const step = card ? card.getBoundingClientRect().width + 24 : 404;\n    track.scrollBy({ left: dir * step, behavior: this.reduced() ? 'auto' : 'smooth' });\n  }\n\n  componentWillUnmount() { clearTimeout(this._t); }\n\n  renderVals() {\n    const items = this.getCases().map((c, i) => Object.assign({}, c, { open: (e) => this.openCase(i, e) }));\n    const st = this.state || {};\n    const active = st.active === undefined ? null : st.active;\n    const phase = st.phase || 0;\n    const from = st.from || null;\n    let cardTransform = 'translate(-50%, -50%)';\n    if (active !== null && phase === 0 && from && typeof window !== 'undefined') {\n      const vw = window.innerWidth, vh = window.innerHeight;\n      const w = Math.min(880, vw * 0.92);\n      const s = from.w / w;\n      cardTransform = 'translate(calc(-50% + ' + (from.x - vw / 2) + 'px), calc(-50% + ' + (from.y - vh / 2) + 'px)) scale(' + s + ')';\n    }\n    const ind = st.ind || 0;\n    const indList = this.getInds();\n    const inds = indList.map((d, i) => Object.assign({}, d, {\n      isActive: i === ind,\n      color: i === ind ? '#FFFFFF' : '#7A7A7A',\n      pick: () => this.setInd(i),\n      done: () => this.setInd(i + 1)\n    }));\n    return {\n      inds: inds,\n      indShift: (-1.25 * ind) + 'em',\n      indNum: '0' + (ind + 1),\n      indTotal: '0' + indList.length,\n      indPlay: st.indPaused ? 'paused' : 'running',\n      indPrev: () => this.setInd(ind - 1),\n      indNext: () => this.setInd(ind + 1),\n      indPause: () => this.setState({ indPaused: true }),\n      indResume: () => this.setState({ indPaused: false }),\n      items: items,\n      isOpen: active !== null,\n      activeCase: active !== null ? items[active] : items[0],\n      cardTransform: cardTransform,\n      bdOpacity: phase ? 0.55 : 0,\n      contentOpacity: phase ? 1 : 0,\n      close: () => this.closeCase(),\n      prev: (e) => this.scrollCases(-1, e),\n      next: (e) => this.scrollCases(1, e)\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"
